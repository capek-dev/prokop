name: Desktop checks

on:
  push:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-check.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-check.yml'

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - run: cargo fmt --check --manifest-path apps/desktop/Cargo.toml
      - run: cargo check --locked --manifest-path apps/desktop/Cargo.toml
      - run: cargo test --locked --manifest-path apps/desktop/Cargo.toml
