name: Release

on:
  workflow_dispatch:
    inputs:
      release_server:
        description: 'Release server'
        required: false
        default: false
        type: boolean
      force:
        description: 'Force release (recreate existing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare-releases:
    runs-on: ubuntu-latest
    outputs:
      has_server: ${{ steps.matrix.outputs.has_server }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        run: |
          HAS_SERVER="false"

          # Server
          if [ "${{ inputs.release_server }}" = "true" ]; then
            HAS_SERVER="true"
          fi

          echo "has_server=$HAS_SERVER" >> $GITHUB_OUTPUT

  prepare-server-release:
    needs: prepare-releases
    if: needs.prepare-releases.outputs.has_server == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release
        id: release
        env:
          FORCE: ${{ inputs.force }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Version source is package.json; VERSION only records the announced version
          V=$(jq -r .version packages/server/package.json) && TAG="server/v${V}"
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          if gh release view "$TAG" 2>/dev/null; then
            if [ "$FORCE" != "true" ]; then
              echo "Skipping $TAG - release already exists"
              exit 0
            fi
            echo "Deleting existing release $TAG for force recreation..."
            gh release delete "$TAG" --yes || true
          fi
          git tag -f "$TAG"
          git push origin "$TAG" --force

          [[ "$V" == *"-"* ]] && PRE="--prerelease" || PRE=""
          NOTES_FLAG=""
          if [ -s "changelogs/server/v${V}.md" ]; then
            NOTES_FLAG="--notes-file changelogs/server/v${V}.md"
          fi
          gh release create "$TAG" --title "Server $V" $PRE $NOTES_FLAG

  release-server-macos:
    needs: prepare-server-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install

      - name: Build embedded client
        run: cd packages/client && VITE_BASE=/ bun run build

      - name: Build macOS binary
        env:
          V: ${{ needs.prepare-server-release.outputs.version }}
        run: |
          mkdir -p packages/server/dist
          bun build --compile --target=bun-darwin-arm64 --asset packages/client/dist --define=PROKOPAI_VERSION="'${V}'" --outfile=packages/server/dist/prokop-darwin packages/server/src/cli.ts

      - name: Import Apple Certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          echo "$CSC_LINK" | base64 --decode > "$CERT_PATH"
          security create-keychain -p actions "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CSC_KEY_PASSWORD" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k actions "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Remove existing signature
        run: codesign --remove-signature packages/server/dist/prokop-darwin || true

      - name: Code Sign
        run: |
          IDENTITY=$(security find-identity -v -p codesigning $RUNNER_TEMP/signing.keychain-db | grep "Developer ID Application" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Signing identity: $IDENTITY"
          codesign --force --options runtime \
            --entitlements packages/server/build/entitlements.mac.plist \
            --sign "$IDENTITY" \
            packages/server/dist/prokop-darwin

      - name: Verify Signature
        run: codesign --verify --deep --strict --verbose=2 packages/server/dist/prokop-darwin

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd packages/server/dist
          zip -y prokop-darwin.zip prokop-darwin
          xcrun notarytool submit prokop-darwin.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          rm prokop-darwin.zip

      - name: Staple Notarization Ticket
        run: xcrun stapler staple packages/server/dist/prokop-darwin || echo "Stapling skipped (expected for bare binaries)"

      - name: Upload macOS Binary
        env:
          TAG: ${{ needs.prepare-server-release.outputs.tag }}
        run: gh release upload "$TAG" packages/server/dist/prokop-darwin --clobber

      - name: Cleanup Keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/signing.keychain-db || true

  release-server-linux-windows:
    needs: prepare-server-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install

      - name: Build embedded client
        run: cd packages/client && VITE_BASE=/ bun run build

      - name: Build Linux and Windows binaries
        env:
          V: ${{ needs.prepare-server-release.outputs.version }}
        run: |
          mkdir -p packages/server/dist
          bun build --compile --target=bun-linux-x64 --asset packages/client/dist --define=PROKOPAI_VERSION="'${V}'" --outfile=packages/server/dist/prokop-linux packages/server/src/cli.ts
          bun build --compile --target=bun-windows-x64-baseline --asset packages/client/dist --define=PROKOPAI_VERSION="'${V}'" --outfile=packages/server/dist/prokop-windows.exe packages/server/src/cli.ts

      - name: Upload Linux and Windows binaries
        env:
          TAG: ${{ needs.prepare-server-release.outputs.tag }}
        run: gh release upload "$TAG" packages/server/dist/prokop-linux packages/server/dist/prokop-windows.exe --clobber

  announce-server:
    needs: [prepare-server-release, release-server-macos, release-server-linux-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Create server announcement pull request
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.prepare-server-release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          BRANCH="release/announce-server-${V}"
          git checkout -B "$BRANCH" "origin/$DEFAULT_BRANCH"
          CURRENT=$(cat packages/server/VERSION 2>/dev/null | tr -d '[:space:]')
          if [ "$V" = "$CURRENT" ]; then
            echo "Server VERSION already at $V - nothing to announce"
            exit 0
          fi

          echo "$V" > packages/server/VERSION
          git add packages/server/VERSION
          git commit -m "release: announce server $V"
          git push --force origin "HEAD:$BRANCH"

          if gh pr list --head "$BRANCH" --base "$DEFAULT_BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH" \
              --title "release: announce server $V" \
              --body "Announces server $V after all release artifacts were published successfully."
          else
            echo "Announcement pull request already exists for $BRANCH"
          fi
