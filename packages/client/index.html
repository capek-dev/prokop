<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1c1c1c" />
    <title>Prokop</title>
    <script>
      (function() {
        var settings = null;
        try {
          var raw = localStorage.getItem('prokopai-theme-settings');
          if (raw) {
            settings = JSON.parse(raw);
          }
        } catch (_) {}
        if (!settings) {
          try {
            var legacy = localStorage.getItem('prokopai-theme');
            if (legacy) {
              settings = JSON.parse(legacy);
            }
          } catch (_) {}
        }
        var mode = 'dark';
        var scheme = 'neutral';
        if (settings) {
          mode = settings.mode || mode;
          scheme = settings.scheme || scheme;
          if (mode === 'system') {
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            mode = prefersDark ? 'dark' : 'light';
          }
        }
        var root = document.documentElement;
        root.classList.remove('light', 'dark', 'neutral', 'primary');
        root.classList.add(mode, scheme);
        // Title bar color before first paint: the exact color saved by the app
        // for this mode and scheme (lib/desktopChrome.ts), else a close default.
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          var color = mode === 'light' ? '#eff0f3' : '#1c1c1c';
          try {
            var saved = JSON.parse(localStorage.getItem('prokopai-theme-color') || 'null');
            if (saved && saved.key === mode + '.' + scheme && /^#[0-9a-f]{6}$/i.test(saved.color)) color = saved.color;
          } catch (_) {}
          themeColor.setAttribute('content', color);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
